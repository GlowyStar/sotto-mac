// The frames of the sotto relay protocol. docs/protocol.md, section 7, lists this file
// and states the rules that a schema cannot express. The number and the type of a field
// never change once they are merged (section 7.2).
syntax = "proto3";

package sotto;

// Client to relay: one frame is one ClientFrame.
message ClientFrame {
  oneof frame {
    Login login = 1;
    UploadBundle upload_bundle = 2;
    FetchBundle fetch_bundle = 3;
    Send send = 4;
    Ack ack = 5;
    StartBlob start_blob = 6;
    PutBlob put_blob = 7;
    FetchBlob fetch_blob = 8;
    DeleteBlob delete_blob = 9;
  }
}

// Relay to client: one frame is one ServerFrame.
message ServerFrame {
  oneof frame {
    Hello hello = 1;
    LoggedIn logged_in = 2;
    BundleStored bundle_stored = 3;
    Bundle bundle = 4;
    Stored stored = 5;
    Deliver deliver = 6;
    Error error = 7;
    BlobStored blob_stored = 8;
    BlobData blob_data = 9;
  }
}

message Hello {
  uint32 version = 1;
  bytes nonce = 2;
}

message Login {
  bytes identity_key = 1;
  bytes client_nonce = 2;
  bytes signature = 3;
}

message LoggedIn {
  uint32 one_time_prekey_count = 1;
  uint32 blob_max_bytes = 2;
}

message SignedPrekey {
  uint32 id = 1;
  bytes key = 2;
  bytes signature = 3;
}

message OneTimePrekey {
  uint32 id = 1;
  bytes key = 2;
}

message UploadBundle {
  bytes identity_dh_key = 1;
  bytes identity_dh_signature = 2;
  SignedPrekey signed_prekey = 3;
  repeated OneTimePrekey one_time_prekeys = 4;
}

message BundleStored {
  uint32 one_time_prekey_count = 1;
}

message FetchBundle {
  bytes identity = 1;
}

message Bundle {
  bytes identity = 1;
  bytes identity_dh_key = 2;
  bytes identity_dh_signature = 3;
  SignedPrekey signed_prekey = 4;
  OneTimePrekey one_time_prekey = 5;
}

message Send {
  bytes message_id = 1;
  bytes recipient = 2;
  bytes payload = 3;
}

message Stored {
  bytes message_id = 1;
}

message Deliver {
  bytes message_id = 1;
  bytes sender = 2;
  bytes payload = 3;
}

message MessageRef {
  bytes message_id = 1;
  bytes sender = 2;
}

message Ack {
  repeated MessageRef messages = 1;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  UNKNOWN_RECIPIENT = 1;
  QUEUE_FULL = 2;
  STORAGE_FULL = 3;
  RATE_LIMITED = 4;
  NOT_FOUND = 5;
  BAD_BUNDLE = 6;
  IDENTITY_KEY_MISMATCH = 7;
  QUOTA_FULL = 8;
  BLOB_TOO_LARGE = 9;
}

message Error {
  ErrorCode code = 1;
  bytes message_id = 2;
  bytes identity = 3;
  bytes blob_id = 4;
}

// The blob frames of part 3 (section 30).
message StartBlob {
  bytes blob_id = 1;
  bytes recipient = 2;
  uint32 length = 3;
}

message PutBlob {
  bytes blob_id = 1;
  uint32 offset = 2;
  bytes data = 3;
}

message BlobStored {
  bytes blob_id = 1;
  uint32 stored_length = 2;
}

message FetchBlob {
  bytes blob_id = 1;
  bytes uploader = 2;
  uint32 offset = 3;
  uint32 length = 4;
}

message BlobData {
  bytes blob_id = 1;
  bytes uploader = 2;
  uint32 offset = 3;
  bytes data = 4;
}

message DeleteBlob {
  bytes blob_id = 1;
  bytes uploader = 2;
}

// The payload of a Send and of a Deliver: one PeerMessage.
message PeerMessage {
  uint32 version = 1;
  InitialHeader initial_header = 2;
  bytes header = 3;
  bytes ciphertext = 4;
}

message InitialHeader {
  bytes identity_dh_key = 1;
  bytes identity_dh_signature = 2;
  bytes ephemeral_key = 3;
  uint32 signed_prekey_id = 4;
  optional uint32 one_time_prekey_id = 5;
}

// The plaintext of a message before padding.
message Content {
  oneof body {
    string text = 1;
    Attachment attachment = 2;
  }
}

// A file that travels as a blob of the relay (section 32).
message Attachment {
  bytes blob_id = 1;
  bytes key = 2;
  uint32 size = 3;
  bytes digest = 4;
  string media_type = 5;
  string file_name = 6;
  uint32 width = 7;
  uint32 height = 8;
  bytes thumbnail = 9;
  string caption = 10;
}
